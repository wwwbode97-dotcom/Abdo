 return `<details class=dt><summary>🏦 تقرير إدخال / إخراج النقدية — صافي ${sgn(i-o)}</summary><div class=rw><span>إجمالي الداخل</span><b class=up>${fmt(i)}</b></div><div class=rw><span>إجمالي الخارج</span><b class=dn>${fmt(o)}</b></div><div style="margin-top:8px">${L.map(row).join('')||'<div class=empty>لا توجد حركات في هذه الفترة</div>'}</div></details>`}
function setRep0(a,b){const L=(S.sett||[]).filter(s=>s.d>=a&&s.d<=b),net=L.reduce((s,x)=>s+x.diff,0),g={};L.forEach(s=>(g[s.d]=g[s.d]||[]).push(s));
 return `<details class=dt><summary>⚖️ سجل التسويات — صافي ${sgn(net)} (${L.length})</summary>${Object.keys(g).sort().reverse().map(d=>`<b style="display:block;margin:10px 0 4px">${d} — صافي ${sgn(g[d].reduce((s,x)=>s+x.diff,0))}</b>`+g[d].map(s=>`<div class=tx><div class=r1><b>${esc((A(s.acc)||{}).name||'—')}</b><b class="${s.diff>0?'up':s.diff<0?'dn':''}">${s.diff?(s.diff>0?'زيادة ':'عجز ')+fmt(Math.abs(s.diff)):'مطابق ✓'}</b></div><small>متوقع ${fmt(s.exp)} • فعلي ${fmt(s.act)}</small>${s.diff?`<br><small>الوجهة: ${esc(s.dest)}</small>`:''}${s.note?`<br><small>📝 ${esc(s.note)}</small>`:''}</div>`).join('')).join('')||'<div class=empty>لا توجد تسويات في هذه الفترة</div>'}</details>`}
/* ---- قراءة رسالة "تم تحويل" ---- */
function parseSms(raw){const txt=String(raw).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٬،]/g,','),n=norm(txt);
 if(!/تحويل/.test(n)||/استلام|استلمت/.test(n))return parseSmsOld(raw);
 const am=n.match(/تحويل\s*([\d,]+(?:\.\d+)?)/)||n.match(/([\d,]+(?:\.\d+)?)\s*جنيه/),amt=am?+am[1].replace(/,/g,''):0,
 pm=txt.match(/رقم\s*(0\s?1[\d\s\-]{8,12}\d)/)||txt.match(/(0\s?1[\d\s\-]{8,12}\d)/),ph=pm?dg(pm[1]).slice(0,11):'',
 own=ph.length==11?S.acc.find(a=>(a.ty=='wallet'||a.ty=='insta')&&dg(a.no).length>=10&&dg(a.no).slice(-10)==ph.slice(-10)):null,dr=first('drawer');
 if(amt)$('am').value=amt;
 if(own){$('t').innerHTML=opts(own.id);if($('f').value==own.id)$('f').innerHTML=opts(dr)}
 else if(ph){$('t').innerHTML=opts(dr);const wf=A($('f').value);if(!wf||!(wf.ty=='wallet'||wf.ty=='insta'))$('f').innerHTML=opts(first('wallet')||first('insta'))}
 if(ph)$('nt').value='إلى رقم '+ph;chg();
 toast(own?`✓ ${fmt(amt)} ج إلى ${own.name} — اختار حساب "من"`:ph?`✓ ${fmt(amt)} ج — رقم غير مسجل: اختار المحفظة اللي خرج منها وهيدخل الدرج`:'لم أجد رقم موبايل واضح في الرسالة');return !!amt}

</script>
<script>
/* ===== Google Drive sync (appDataFolder) + PWA ===== */
const GD={cfg:(()=>{try{return JSON.parse(localStorage.getItem('gd')||'{}')}catch(e){return{}}})(),tok:null,exp:0,busy:0,t:null,armed:0};
const gsave=()=>{try{localStorage.setItem('gd',JSON.stringify(GD.cfg))}catch(e){}};
function gSet(s){GST=s;const e=$('cld');if(e)e.textContent=gIc()}
const gH=()=>({Authorization:'Bearer '+GD.tok});
const API={
 async list(){const r=await fetch('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=50&orderBy=modifiedTime%20desc&fields=files(id,name,appProperties,modifiedTime)',{headers:gH()});if(!r.ok)throw new Error('list '+r.status);return(await r.json()).files||[]},
 async get(id){const r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media',{headers:gH()});if(!r.ok)throw new Error('get '+r.status);return r.text()},
 async put(name,body,upd,id){const meta={name,appProperties:{upd:String(upd)}};if(!id)meta.parents=['appDataFolder'];const bd='b'+Date.now(),mp='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+body+'\r\n--'+bd+'--';
  const r=await fetch('https://www.googleapis.com/upload/drive/v3/files'+(id?'/'+id:'')+'?uploadType=multipart&fields=id',{method:id?'PATCH':'POST',headers:Object.assign({'Content-Type':'multipart/related; boundary='+bd},gH()),body:mp});if(!r.ok)throw new Error('put '+r.status);return(await r.json()).id},
 async del(id){await fetch('https://www.googleapis.com/drive/v3/files/'+id,{method:'DELETE',headers:gH()})}};
function gLoad(){return new Promise((ok,no)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return ok();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=()=>no(new Error('تعذر تحميل مكتبة جوجل (تأكد من النت)'));document.head.appendChild(s)})}
function gTok(interactive,prompt){return new Promise(async(ok,no)=>{if(GD.tok&&Date.now()<GD.exp-60000)return ok(GD.tok);if(!interactive)return no(new Error('auth'));
 try{await gLoad();const c=google.accounts.oauth2.initTokenClient({client_id:GD.cfg.cid,scope:'https://www.googleapis.com/auth/drive.appdata openid email',callback:r=>{if(r.error)return no(new Error(r.error));GD.tok=r.access_token;GD.exp=Date.now()+(r.expires_in||3600)*1e3;GD.cfg.conn=1;gsave();ok(GD.tok);if(!GD.cfg.hint)fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+r.access_token}}).then(x=>x.json()).then(u=>{if(u&&u.email){GD.cfg.hint=u.email;gsave()}}).catch(()=>{})},error_callback:e=>no(new Error((e&&e.type)||'popup'))});c.requestAccessToken(GD.cfg.hint&&!prompt?{prompt:'',hint:GD.cfg.hint}:{prompt:prompt||''})}catch(e){no(e)}})}
const gUpd=f=>+((f.appProperties||{}).upd||0);
async function gVersions(api,files,body,upd){const vs=files.filter(f=>f.name.startsWith('v-')).sort((a,b)=>b.modifiedTime.localeCompare(a.modifiedTime));
 if(!vs[0]||Date.now()-new Date(vs[0].modifiedTime).getTime()>6*36e5){await api.put('v-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json',body,upd,0)}
 for(const f of vs.slice(4))await api.del(f.id)}
async function gPull(api,main){const d=JSON.parse(await api.get(main.id));if(!d.acc)throw new Error('ملف غير صالح');try{localStorage.setItem('db_prev',JSON.stringify(S))}catch(e){}
 S=d;S.set=Object.assign({cr:1.5,cs:1,ci:1},S.set||{});LASTJ='';save();GD.cfg.synced=gUpd(main)||(+d.upd||0);GD.cfg.fid=main.id;gsave();render()}
async function gPush(api,files,main){const body=JSON.stringify(S),upd=S.upd||Date.now();if(!S.upd)S.upd=upd;
 const id=await api.put('ledger.json',body,upd,main?main.id:0);GD.cfg.fid=id;GD.cfg.synced=upd;gsave();await gVersions(api,files,body,upd)}
async function syncCore(api,ask){const files=await api.list(),main=files.find(f=>f.name=='ledger.json'),lu=S.upd||0,ls=GD.cfg.synced||0;
 if(!main){await gPush(api,files,null);return'up'}
 const ru=gUpd(main);if(ru==lu){GD.cfg.synced=lu;gsave();return'same'}
 const changed=lu>ls;
 if(ru>ls&&changed){try{const rb=JSON.parse(await api.get(main.id)),f=(k,v)=>(k=='upd'||k=='hide')?undefined:v;if(JSON.stringify(rb,f)===JSON.stringify(S,f)){GD.cfg.synced=Math.max(ru,lu);gsave();return'same'}}catch(e){}const useRemote=ask(new Date(ru).toLocaleString('ar-EG'),new Date(lu).toLocaleString('ar-EG'));if(useRemote){await gPull(api,main);return'down'}await gPush(api,files,main);return'up'}
 if(ru>ls){await gPull(api,main);return'down'}
 if(changed){await gPush(api,files,main);return'up'}
 return'same'}
const gAsk=(r,l)=>confirm('⚠️ نسخة جوجل درايف مختلفة عن نسخة هذا الجهاز.\n\nالدرايف: '+r+'\nهذا الجهاز: '+l+'\n\nموافق = استخدام نسخة الدرايف (تعديلات هذا الجهاز غير المرفوعة هتضيع، وفيه نسخة احتياطية محلية).\nإلغاء = رفع نسخة هذا الجهاز مكان الدرايف.');
async function gSync(manual){if(!GD.cfg.cid||!GD.cfg.conn||GD.busy)return;if(!navigator.onLine){gSet('err');return}GD.busy=1;gSet('sync');
 try{await gTok(manual);const r=await syncCore(API,gAsk);GD.cfg.last=Date.now();gsave();gSet('ok');if(manual)toast(r=='up'?'✓ تم رفع النسخة':r=='down'?'✓ تم تحميل نسخة الدرايف':'✓ كل شيء متزامن')}
 catch(e){const m=String(e&&e.message||e);if(m=='auth'){gSet('auth');gArm()}else if(/popup/.test(m)){gSet('auth');GD.noArm=Date.now()+180000;if(!GD.fromTap&&manual)toast('اسمح بالنوافذ المنبثقة للموقع ثم اضغط ☁️ تاني')}else{gSet('err');if(manual&&!GD.fromTap)toast('تعذرت المزامنة: '+m.slice(0,60))}}finally{GD.busy=0;GD.fromTap=0}}
function gArm(){if(GD.armed||Date.now()<(GD.noArm||0))return;GD.armed=1;document.addEventListener('click',()=>{GD.armed=0;GD.fromTap=1;gSync(true)},{once:true,capture:true})}
function cloudDirty(){if(!GD.cfg.conn)return;clearTimeout(GD.t);GD.t=setTimeout(()=>gSync(false),4000)}
async function gConnect(){const v=($('gcid')||{}).value;if(v)GD.cfg.cid=v.trim();if(!GD.cfg.cid)return toast('اكتب الـ Client ID أولًا');gsave();
 try{await gTok(true,'select_account');GD.cfg.conn=1;gsave();closeSh();await gSync(true)}catch(e){toast('تعذر تسجيل الدخول: '+(e.message||e).toString().slice(0,60))}}
function gDisc(){if(!confirm('إلغاء الربط؟ البيانات المحلية والنسخ على الدرايف تفضل زي ما هي.'))return;try{if(GD.tok&&window.google)google.accounts.oauth2.revoke(GD.tok)}catch(e){}GD.tok=null;GD.cfg.conn=0;gsave();gSet('off');closeSh();toast('تم إلغاء الربط');gateShow()}
async function gVers(){try{await gTok(true);const f=(await API.list()).filter(x=>x.name.startsWith('v-')||x.name=='ledger.json');
 sheet('🕘 النسخ على الدرايف',f.map(x=>`<div class=tx><div class=r1><span>${x.name=='ledger.json'?'النسخة الحالية':'نسخة '+x.name.slice(2,-5)}</span><small>${new Date(x.modifiedTime).toLocaleString('ar-EG')}</small></div>${x.name!='ledger.json'?`<div class=acts><small style="color:var(--p)" onclick="gRestore('${x.id}')">♻️ استعادة</small></div>`:''}</div>`).join('')||'<div class=empty>لا توجد نسخ</div>')}catch(e){toast('تعذر التحميل: '+(e.message||e).toString().slice(0,60))}}
function gRestore(id){askPin(async()=>{if(!confirm('استعادة هذه النسخة مكان البيانات الحالية؟ (هتتحفظ نسخة محلية قبلها)'))return;try{await gTok(true);const d=JSON.parse(await API.get(id));if(!d.acc)throw new Error('ملف غير صالح');localStorage.setItem('db_prev',JSON.stringify(S));S=d;S.set=Object.assign({cr:1.5,cs:1,ci:1},S.set||{});LASTJ='';save();S.upd=Date.now();save();render();closeSh();toast('✓ تمت الاستعادة');gSync(true)}catch(e){toast('تعذرت الاستعادة: '+(e.message||e).toString().slice(0,60))}})}
function cloudUI(){const ok=location.protocol=='https:'||location.hostname=='localhost',c=GD.cfg,st={off:'غير متصل',ok:'متزامن ✓',sync:'جاري المزامنة...',auth:'محتاج تأكيد (اضغط أي مكان)',err:'تعذرت المزامنة / لا يوجد نت'}[GST];
 sheet('☁️ جوجل درايف · إصدار 5',(ok?'':'<div class=alert>⚠️ تسجيل الدخول بجوجل لا يعمل إلا لو التطبيق مفتوح من رابط https (بعد رفعه على الاستضافة). الآن مفتوح كملف.</div>')+
 `<p style="color:var(--mu);font-size:13px">بيحفظ نسخة تلقائيًا بعد كل تعديل في مجلد مخفي خاص بالتطبيق على درايفك، وبيحتفظ بآخر 5 نسخ.</p>
 <label>Google Client ID</label><input id=gcid value="${c.cid||''}" placeholder="xxxx.apps.googleusercontent.com" style="direction:ltr">
 ${c.conn?`<p>الحالة: <b>${st}</b>${c.last?'<br><small>آخر مزامنة: '+new Date(c.last).toLocaleString('ar-EG')+'</small>':''}</p><button class=btn onclick="askPin(()=>gSync(true))">🔄 مزامنة الآن</button><button class="btn g" onclick="askPin(()=>gVers())">🕘 النسخ السابقة / استعادة</button><button class="btn g" onclick="gSetCid()">💾 حفظ الـ Client ID</button><button class="btn d" onclick="gDisc()">⏏️ إلغاء الربط</button>`:`<button class=btn onclick="gConnect()">🔗 تسجيل الدخول بحساب جوجل</button>`}`)}
function gSetCid(){GD.cfg.cid=($('gcid').value||'').trim();gsave();toast('✓ تم الحفظ')}
window.addEventListener('online',()=>gSync(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&GD.cfg.conn)gSync(false)});

/* ===== بوابة الدخول بحساب جوجل ===== */
const GCID='';/* ← ضع هنا الـ Client ID بتاعك بعد إنشائه في Google Cloud (انظر README) */
if(!GD.cfg.cid&&GCID){GD.cfg.cid=GCID;gsave()}
function gateShow(){const g=document.getElementById('gate');if(!g)return;const need=location.protocol=='https:'&&!GD.cfg.conn;g.classList.toggle('on',need);const i=document.getElementById('gcid0');if(i)i.style.display=GD.cfg.cid?'none':''}
async function gateLogin(){const e=document.getElementById('gerr'),i=document.getElementById('gcid0');e.textContent='';if(i&&i.value.trim())GD.cfg.cid=i.value.trim();if(!GD.cfg.cid){e.textContent='اكتب الـ Client ID أولًا';if(i)i.style.display='';return}gsave();
 try{await gTok(true,'select_account');GD.cfg.conn=1;gsave();gateShow();await gSync(true)}catch(x){e.textContent='تعذر تسجيل الدخول: '+String((x&&x.message)||x).slice(0,80)}}
gateShow();
if(GD.cfg.conn){gSet('auth');gSync(false)}
if('serviceWorker' in navigator&&(location.protocol=='https:'||location.hostname=='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
